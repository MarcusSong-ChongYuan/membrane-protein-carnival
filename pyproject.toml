[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mempro-repro"
version = "0.1.0"
description = "Portable verification and delivery tools for the MemPro FORMAL release"
requires-python = ">=3.11"
authors = [{name = "MemPro project"}]

[project.scripts]
mempro = "mempro_repro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

